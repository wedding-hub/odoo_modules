services:
  web:
    image: odoo:20.0
    platform: linux/amd64
    container_name: odoo20_web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8070:8069"
      - "8073:8072"
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - odoo20-web-data:/var/lib/odoo
      - ./config:/etc/odoo
      - .:/mnt/extra-addons
    restart: unless-stopped

  db:
    image: postgres:latest
    container_name: odoo20_db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
    volumes:
      - odoo20-db-data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  odoo20-web-data:
  odoo20-db-data:
